# e-Saraban — nginx reverse proxy หน้า Next.js (spec §11.1)
#
# หน้าที่: จำกัดขนาด body, กัน request ผิดรูป, ทำ TLS termination
# แล้วปล่อยให้ Next โฟกัสเรื่อง render อย่างเดียว
#
# ⚠️ ตอนนี้เปิดเฉพาะ HTTP :80 เพราะยังไม่มีคำตอบเรื่อง TLS cert (spec §15 ข้อ 7)
#    เมื่อได้ cert แล้วให้วางไฟล์ไว้ที่ docker/nginx/certs/ แล้วเปิด block ท้ายไฟล์

# ส่ง "Connection: upgrade" เฉพาะ request ที่ขอ upgrade จริง
# request ธรรมดาต้องได้ "close" ไม่งั้น keepalive กับ upstream พัง
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream esaraban_app {
    server app:3000;
    keepalive 32;
}

# ปิดการเปิดเผยเวอร์ชัน nginx ใน header และหน้า error
server_tokens off;

# บีบอัดเฉพาะชนิดที่บีบแล้วได้ผล — ไฟล์แนบ (pdf/zip/รูป) บีบซ้ำไม่คุ้ม
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_proxied any;
gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/rss+xml
    image/svg+xml
    font/woff2;

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # ไฟล์แนบสูงสุด 50MB ตาม spec §8.3 — เผื่อ overhead ของ multipart
    # ต้องมากกว่า serverActions.bodySizeLimit ใน next.config.ts
    client_max_body_size 55m;
    client_body_timeout 300s;

    # upload/ดาวน์โหลดไฟล์ใหญ่บนเครือข่ายภายในอาจใช้เวลานาน
    proxy_connect_timeout 10s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── static assets ที่มี hash ในชื่อไฟล์ — Next ตั้ง immutable ให้แล้ว ──
    location /_next/static/ {
        proxy_pass http://esaraban_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_cache_valid 200 365d;
    }

    # ── ส่งไฟล์แนบ — stream ตรงไม่ต้อง buffer ลงดิสก์ของ nginx ──
    location /api/files/ {
        proxy_pass http://esaraban_app;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://esaraban_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # จำเป็นสำหรับ HMR ตอน dev และ streaming ของ React Server Components
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}

# ── HTTPS — เปิดใช้เมื่อได้ cert แล้ว (spec §15 ข้อ 7) ────────────────
#
# ขั้นตอน:
#   1. วาง fullchain.pem / privkey.pem ไว้ที่ docker/nginx/certs/
#   2. ลบคอมเมนต์ block ด้านล่าง
#   3. เปลี่ยน server block :80 ข้างบนให้เหลือแค่ redirect:
#        return 301 https://$host$request_uri;
